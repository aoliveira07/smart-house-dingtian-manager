name: Validate application and shared engine
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install pytest pytest-asyncio ruff -r dingtian_manager/requirements.txt
      - run: ruff check . && ruff format --check .
      - run: pytest tests/test_manager.py tests/test_addon.py -q
      - run: npm ci && npm run build && npm test
      - run: python scripts/build_addon.py
      - run: git diff --exit-code custom_components/smart_house_dingtian/frontend dingtian_manager/app/core dingtian_manager/static/panel.js
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: installable-beta
          path: dist/*.zip
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-ha-test.txt
      - run: pip install -r requirements-ha-test.txt
      - run: pytest tests/ha -v --tb=short
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
  application-container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform ${{ matrix.platform }} --build-arg BUILD_ARCH=${{ matrix.arch }} --load -t dingtian-test dingtian_manager
      - run: python scripts/smoke_container.py
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    needs: [core, home-assistant, hacs, application-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installable-beta
          path: dist
      - name: Publish tested beta assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\nCI da release: %s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> docs/RELEASE_NOTES.md
          gh release create v1.5.0 dist/*.zip --target "$GITHUB_SHA" --prerelease --title "1.5.0 — Dingtian Manager aplicativo" --notes-file docs/RELEASE_NOTES.md
