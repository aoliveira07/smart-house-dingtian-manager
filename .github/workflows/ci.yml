name: Validate integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install pytest pytest-asyncio ruff
      - run: ruff check . && ruff format --check .
      - run: pytest tests/test_manager.py -q
      - run: npm ci && npm run build && npm test
      - run: git diff --exit-code custom_components/smart_house_dingtian/frontend
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: installable-beta
          path: dist/*.zip
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant-custom-component==0.13.365
      - run: pytest tests/ha -v --tb=short
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
