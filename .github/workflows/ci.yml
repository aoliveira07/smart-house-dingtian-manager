name: Validate integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install pytest pytest-asyncio ruff
      - run: ruff check . && ruff format --check .
      - run: pytest tests/test_manager.py -q
      - run: npm ci && npm run build && npm test
      - run: git diff --exit-code custom_components/smart_house_dingtian/frontend
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: installable-beta
          path: dist/*.zip
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-ha-test.txt
      - run: pip install -r requirements-ha-test.txt
      - run: pytest tests/ha -v --tb=short
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    needs: [core, home-assistant, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installable-beta
          path: dist
      - name: Publish tested beta assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\nCI da release: %s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> docs/RELEASE_NOTES.md
          gh release create v0.1.0b1 dist/*.zip --target "$GITHUB_SHA" --prerelease --title "0.1.0b1 — Dingtian Manager beta" --notes-file docs/RELEASE_NOTES.md
